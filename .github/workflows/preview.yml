name: Deploy Branch Preview

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Determine branch name
        id: branch
        run: |
          BRANCH="${{ github.ref_name }}"
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "name=$SAFE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "raw=$BRANCH" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build web for preview
        run: flutter build web --release --base-href "/clautter/"

      - name: Deploy to gh-pages branch
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save the build output
          cp -r build/web /tmp/preview-build

          # Try to fetch the existing gh-pages branch
          if git fetch origin gh-pages 2>/dev/null; then
            git checkout gh-pages
          else
            # gh-pages doesn't exist yet — create an orphan branch
            git checkout --orphan gh-pages
            git rm -rf .
            git commit --allow-empty -m "Initialize gh-pages branch"
          fi

          # Replace all content with the new build
          # (clean everything except .git)
          git rm -rf . 2>/dev/null || true
          cp -r /tmp/preview-build/* .

          # Commit and push
          git add -A
          git commit -m "Deploy preview for ${{ steps.branch.outputs.raw }}" --allow-empty
          git push origin gh-pages
