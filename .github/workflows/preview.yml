name: Deploy Branch Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Determine branch name
        id: branch
        run: |
          # Use head_ref for PRs, ref_name for direct pushes
          BRANCH="${{ github.head_ref || github.ref_name }}"
          # Sanitize branch name for use as a directory (replace / with -)
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "name=$SAFE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "raw=$BRANCH" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      - name: Build web for preview
        run: flutter build web --release --base-href "/clautter/preview/${{ steps.branch.outputs.name }}/"

      - name: Deploy to gh-pages branch (preview subdirectory)
        run: |
          PREVIEW_DIR="preview/${{ steps.branch.outputs.name }}"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save the build output
          cp -r build/web /tmp/preview-build

          # Fetch gh-pages branch (or create it)
          git fetch origin gh-pages:gh-pages 2>/dev/null || git checkout --orphan gh-pages

          git checkout gh-pages

          # Create/update the preview subdirectory
          rm -rf "$PREVIEW_DIR"
          mkdir -p "$PREVIEW_DIR"
          cp -r /tmp/preview-build/* "$PREVIEW_DIR/"

          # Commit and push
          git add "$PREVIEW_DIR"
          git commit -m "Deploy preview for ${{ steps.branch.outputs.raw }}" --allow-empty
          git push origin gh-pages

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = `https://${context.repo.owner}.github.io/clautter/preview/${{ steps.branch.outputs.name }}/`;
            const body = `## Preview Deployment\n\nThis PR has been deployed for preview:\n\n**[Open Preview](${previewUrl})**\n\n_Updated for commit ${context.sha.substring(0, 7)}_`;

            // Find existing bot comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Deployment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview directory
        run: |
          BRANCH="${{ github.head_ref }}"
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g')
          PREVIEW_DIR="preview/$SAFE_BRANCH"

          if [ -d "$PREVIEW_DIR" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "$PREVIEW_DIR"
            git commit -m "Clean up preview for $BRANCH"
            git push origin gh-pages
          fi
