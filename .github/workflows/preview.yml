name: Deploy Branch Preview

# Builds the Next.js site for a branch and publishes it under
# gh-pages/preview/<branch>/ so it is reachable at
# https://<owner>.github.io/clautter/preview/<branch>/.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Determine safe branch name
        id: branch
        run: |
          BRANCH="${{ github.ref_name }}"
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "name=$SAFE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "raw=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Build Next.js site for preview
        working-directory: website
        env:
          NEXT_PUBLIC_BASE_PATH: "/clautter/preview/${{ steps.branch.outputs.name }}"
        run: |
          npm ci
          npm run build
          # The committed embed's <base href> targets the production path; rewrite
          # it to this preview's path so the Flutter assets resolve correctly.
          sed -i "s#<base href=\"/clautter/embeds/clautter/\">#<base href=\"${NEXT_PUBLIC_BASE_PATH}/embeds/clautter/\">#" out/embeds/clautter/index.html

      - name: Deploy to gh-pages/preview/<branch>
        run: |
          PREVIEW_DIR="preview/${{ steps.branch.outputs.name }}"

          # Save the static export
          cp -r website/out /tmp/preview-build

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Clean working tree
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true

          # Fetch or create gh-pages branch
          if git fetch origin gh-pages 2>/dev/null; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
            git commit --allow-empty -m "Initialize gh-pages branch"
          fi

          # .nojekyll so Pages serves the _next/ folder as-is
          touch .nojekyll

          # Replace only this branch's preview directory
          rm -rf "$PREVIEW_DIR"
          mkdir -p "$PREVIEW_DIR"
          cp -r /tmp/preview-build/* "$PREVIEW_DIR/"

          git add -A
          git diff --cached --quiet || git commit -m "Deploy preview for ${{ steps.branch.outputs.raw }}"
          git push origin gh-pages

      - name: Post preview URL
        run: |
          REPO="${{ github.repository }}"
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          PREVIEW_DIR="preview/${{ steps.branch.outputs.name }}"
          echo "### Preview deployed"
          echo "https://${OWNER}.github.io/clautter/${PREVIEW_DIR}/"
