name: Deploy to GitHub Pages

# Builds the Next.js site in website/ and publishes the static export to the
# root of the gh-pages branch (the Flutter app is only the embedded engine).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build Next.js site
        working-directory: website
        run: |
          npm ci
          npm run build

      - name: Deploy to gh-pages (root)
        run: |
          # Save the static export
          cp -r website/out /tmp/prod-build

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Clean working tree — -x also removes gitignored files (node_modules, out/)
          git checkout -- . 2>/dev/null || true
          git clean -fdx 2>/dev/null || true

          # Fetch or create gh-pages branch
          if git fetch origin gh-pages 2>/dev/null; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
            git commit --allow-empty -m "Initialize gh-pages branch"
          fi

          # Remove everything EXCEPT the preview/ directory and .git
          find . -maxdepth 1 \
            ! -name '.' \
            ! -name '.git' \
            ! -name 'preview' \
            -exec rm -rf {} +

          # Next emits a _next/ folder; .nojekyll stops Pages' Jekyll from
          # ignoring underscore-prefixed paths.
          touch .nojekyll

          # Copy the production build into root
          cp -r /tmp/prod-build/* .

          git add -A
          git diff --cached --quiet || git commit -m "Deploy production from main@${{ github.sha }}"
          git push origin gh-pages
